<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
            font-family: 'Georgia', serif;
        }

        canvas {
            display: block;
        }

        .message-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffffff;
            opacity: 0;
            transition: opacity 3s ease-in-out;
            pointer-events: none;
            width: 85%;
            max-width: 650px;
            z-index: 10;
        }

        .message-container h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            letter-spacing: 3px;
            color: #ffffff;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 25px rgba(255, 105, 180, 0.4);
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        .message-container p {
            font-size: 1.4rem;
            line-height: 1.6;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.5), 0 0 20px rgba(255, 182, 193, 0.4);
            font-family: 'Great Vibes', 'Georgia', cursive;
        }

        /* Teddy bear flying/throwing animation into screen */
        .teddy-container {
            position: absolute;
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%) scale(0.5);
            font-size: 70px;
            opacity: 0;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes throwTeddy {
            0% {
                bottom: -150px;
                transform: translateX(-50%) scale(0.3) rotate(-20deg);
                opacity: 0;
            }
            60% {
                bottom: 45%;
                transform: translateX(-50%) scale(1.2) rotate(15deg);
                opacity: 1;
            }
            80% {
                bottom: 38%;
                transform: translateX(-50%) scale(0.95) rotate(-5deg);
                opacity: 1;
            }
            100% {
                bottom: 40%;
                transform: translateX(-50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .throw-active {
            animation: throwTeddy 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body>

    <canvas id="flowerCanvas"></canvas>

    <div class="message-container" id="messageContainer">
        <h1>My Love</h1>
        <p>I’m sorry about last night and I love you with all my heart and soul forever and ever.</p>
    </div>

    <div class="teddy-container" id="teddyContainer">🧸</div>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Stem {
            constructor(x, targetHeight) {
                this.x = x;
                this.startY = canvas.height;
                this.targetY = canvas.height - targetHeight;
                this.currentY = this.startY;
                this.speed = 2 + Math.random() * 1.5;
                this.reachedTop = false;
                this.flower = null;
            }

            update() {
                if (!this.reachedTop) {
                    this.currentY -= this.speed;
                    if (this.currentY <= this.targetY) {
                        this.currentY = this.targetY;
                        this.reachedTop = true;
                        this.flower = new Flower(this.x, this.currentY);
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, canvas.height);
                ctx.lineTo(this.x, this.currentY);
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                if (this.flower) {
                    this.flower.update();
                    this.flower.draw();
                }
            }
        }

        class Flower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.currentRadius = 0;
                this.maxRadius = 14 + Math.random() * 12;
                this.type = Math.floor(Math.random() * 3); // 3 different flower shapes/styles
                this.petalCount = Math.floor(Math.random() * 4) + 5; // 5 to 8 petals
                
                // Vibrant and varied color palettes for different shapes
                const palettes = [
                    { petal: '#ff4081', center: '#ffd54f' }, // Deep pink
                    { petal: '#ffffff', center: '#ffca28' }, // Crisp white
                    { petal: '#ff80ab', center: '#ff6f00' }, // Light pink
                    { petal: '#e040fb', center: '#ffff00' }, // Vibrant purple/magenta
                    { petal: '#ff6e40', center: '#ffd54f' }, // Coral orange
                    { petal: '#ea80fc', center: '#ffea00' }, // Lavender
                    { petal: '#ff5252', center: '#ffffff' }  // Soft red
                ];
                this.colors = palettes[Math.floor(Math.random() * palettes.length)];
            }

            update() {
                if (this.currentRadius < this.maxRadius) {
                    this.currentRadius += 0.25;
                }
            }

            draw() {
                if (this.currentRadius <= 0) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.fillStyle = this.colors.petal;

                if (this.type === 0) {
                    // Style 1: Classic Rounded Petals
                    for (let i = 0; i < this.petalCount; i++) {
                        const angle = (i * 2 * Math.PI) / this.petalCount;
                        ctx.save();
                        ctx.rotate(angle);
                        ctx.beginPath();
                        ctx.ellipse(0, this.currentRadius * 0.7, this.currentRadius * 0.4, this.currentRadius * 0.7, 0, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.restore();
                    }
                } else if (this.type === 1) {
                    // Style 2: Daisy/Spiky Long Petals
                    for (let i = 0; i < this.petalCount + 2; i++) {
                        const angle = (i * 2 * Math.PI) / (this.petalCount + 2);
                        ctx.save();
                        ctx.rotate(angle);
                        ctx.beginPath();
                        ctx.ellipse(0, this.currentRadius * 0.8, this.currentRadius * 0.2, this.currentRadius * 0.9, 0, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.restore();
                    }
                } else {
                    // Style 3: Rounded Tulip/Cluster style petals
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 2 * Math.PI) / 5;
                        ctx.save();
                        ctx.rotate(angle);
                        ctx.beginPath();
                        ctx.arc(0, this.currentRadius * 0.5, this.currentRadius * 0.45, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Draw Center Pistil / Core
                ctx.beginPath();
                ctx.arc(0, 0, this.currentRadius * 0.35, 0, 2 * Math.PI);
                ctx.fillStyle = this.colors.center;
                ctx.fill();

                ctx.restore();
            }
        }

        let stems = [];
        let totalStems = Math.floor(window.innerWidth / 15);

        function initStems() {
            stems = [];
            let spacing = canvas.width / totalStems;
            for (let i = 0; i < totalStems; i++) {
                let x = i * spacing + Math.random() * spacing;
                let targetHeight = 150 + Math.random() * (canvas.height * 0.45);
                stems.push(new Stem(x, targetHeight));
            }
        }

        initStems();

        let allFlowersGrown = false;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let allReached = true;
            stems.forEach(stem => {
                stem.update();
                stem.draw();
                if (!stem.reachedTop) {
                    allReached = false;
                }
            });

            if (allReached && !allFlowersGrown) {
                allFlowersGrown = true;
                setTimeout(() => {
                    // Show message
                    document.getElementById('messageContainer').style.opacity = '1';
                    // Trigger teddy bear throw effect
                    document.getElementById('teddyContainer').classList.add('throw-active');
                }, 800);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
